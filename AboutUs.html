<!DOCTYPE html>
<html>
    <head>
        <title>Charity Webiste</title> <!--Title of Website-->

    <style>
        * {box-sizing: border-box;}
body {font-family: Verdana, sans-serif;}
.mySlides {display: none;}
img {vertical-align: middle;}

.slideshow-container {
    width: 100%;
    display: flex;
    justify-content: center; /* Centers horizontally */
}

        /* change font size and color*/
.font a{
    font-size: 30px;
    color: #52420c;
    text-decoration: none; 
}
/* create border and change size */
img {
    border: 30px solid #52420c;
    width: 50%;
    display: block;
    margin-left: auto;
    margin-right: auto;
}
/* change font size */
h1 {
    font-size: 70px;
}
/* change font size */
.font-size {
    font-size: 30px;
}

/* make text bold */
p {
    font-weight: 600;
}

.menu {
    text-align: center;
    padding: 10px;
    font-size: 40px;
    font-family: Arial;
    color: #52420c;
  }

  .menu a {
    margin: 0 50px;
    padding: 10px 20px;
    text-decoration: none;
    border-bottom: 5px solid;
    color: #52420c;
  }

  .menu a:hover {
    background-color: whitesmoke;
    box-shadow: 0 15px 20px 0 rgba(0,0,0,0.24),0 17px 50px 0 rgba(0,0,0,0.19);
  }

  .slider{
    width: 1300px;
    max-width: 100%;
    height: 700px;
    position: relative;
    overflow: hidden;
}
.slider .list{
    position: absolute;
    width: max-content;
    height: 100%;
    left: 0;
    top: 0;
    display: flex;
    transition: 1s;
}
.slider .list img{
    width: 1300px;
    max-width: 100vw;
    height: 100%;
    object-fit: cover;
}
.slider .buttons{
    position: absolute;
    top: 45%;
    left: 5%;
    width: 90%;
    display: flex;
    justify-content: space-between;
}
.slider .buttons button{
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background-color: #fff5;
    color: #fff;
    border: none;
    font-family: monospace;
    font-weight: bold;
}
.slider .dots{
    position: absolute;
    bottom: 5px;
    left: 0;
    color: #fff;
    width: 100%;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
}
.slider .dots li{
    list-style: none;
    width: 10px;
    height: 10px;
    background-color: #fff;
    margin: 10px;
    border-radius: 20px;
    transition: 0.5s;
}
.slider .dots li.active{
    width: 30px;
}
@media only screen and (max-width: 300px){
    .slider{
        height: 400px;
    }
}

/* Fading animation */
.fade {
  animation-name: fade;
  animation-duration: 1.5s;
}

@keyframes fade {
  from {opacity: .4} 
  to {opacity: 1}
}


    </style>
    <body bgcolor="#e4d59f"><!--Change bgcolor-->

        <br><br><br><!--Break Line-->

        <div class="slideshow-container">
            <div class="slider">
            <div class="list">
                <div class="item fade">
                    <img src="charity1.jpeg" alt="">
                </div>
                <div class="item fade">
                    <img src="donate1.png" alt="">
                </div>
                <div class="item fade">
                    <img src="volunteer.jpg" alt="">
                </div>
            </div>
            <div class="buttons">
                <button id="prev"><</button>
                <button id="next">></button>
            </div>
            <ul class="dots">

                <li></li>

            </ul>
        </div></div>

    </body>
