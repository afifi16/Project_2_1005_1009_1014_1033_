<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Index</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <style>
   
   html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
}

body {
  font-family: Arial, sans-serif;
}

.header1 {
  padding: 0;
  margin: 0;
}

.header1 img {
  width: 100%; 
  display: block;
  margin: 0;   
  padding: 0;   
}

.w3-bar {
  flex-shrink: 0;
}

.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
}

#contentFrame {
  flex: 1;
  width: 100%;
  border: none;
}

#footerFrame {
  width: 100%;
  height: 80px ;
  border: none;
  flex-shrink: 0;
}

    .w3-bar {
      flex-shrink: 0;
    }

    .menu-icon {
      width: 24px;
      vertical-align: middle;
    }

    .w3-btn.section {
      margin-right: 10px;
    }

    
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header1 w3-container">
    <img src="bannerFund.png" alt="Banner">
  </div>

  <!-- Navigation bar -->
  <div class="w3-bar w3-green">
    <a href="home.html" target="contentFrame" class="w3-btn w3-round section">Home</a>

    <div class="w3-dropdown-hover">
      <button class="w3-button">
        <img src="menu.png" class="menu-icon" alt="Menu Icon">
      </button>
      <div class="w3-dropdown-content w3-bar-block w3-card-4">
        <a href="AboutUs.html" target="contentFrame" class="w3-bar-item w3-button">About Us</a>
        <a href="campaign.html" target="contentFrame" class="w3-bar-item w3-button">Campaign</a>
        <a href="cover.html" target="contentFrame" class="w3-bar-item w3-button">Get Info</a>
        <a href="contactUs.html" target="contentFrame" class="w3-bar-item w3-button">Contact Us</a>
      </div>
    </div>
  </div>

  <!-- Content area that fills remaining space -->
  <div class="main-content">
    <iframe id="contentFrame" name="contentFrame" src="home.html" title="Content Area"></iframe>
  </div>

  <!-- Footer iframe always at bottom -->
  <iframe src="footer.html" name="footer" id="footerFrame"></iframe>
</body>
</html>
