<!DOCTYPE html>
<html>
    <head>
        <script type="text/javascript" src="donation.js"></script>
        <style>
            html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            }
            body{
                background-image: url("background2.jpg");
                background-repeat: no-repeat;
                background-size: cover;
                justify-content: space-between;
            }
            .container{
                background-color: antiquewhite;
                padding: 10px;
                border-radius: 5px;
                width: 80%;
                margin: 20px auto;
            }

            .form-container {
                display: flex;
                flex-direction: column;
                width: 100%;
                margin-bottom: 100px;
            }

            .form-container label {
                font-weight: bold;
                margin-top: 10px;
            }

            .form-container input,
            .form-container select {
                padding: 8px;
                font-size: 14px;
                width: 100%;
                border: 1px solid #ccc;
                border-radius: 5px;
            }

            .form-container input[type="submit"] {
                background-color: #007bff;
                color: white;
                cursor: pointer;
                border: none;
                padding: 10px;
                margin-top: 10px;
            }

            .form-container input[type="submit"]:hover {
                background-color: #0056b3;
            }

            .row {
                display: flex;
                align-items: center;
                gap: 20px;
            }

            a:link, a:visited {
                background-color: #f44336;
                color: white;
                padding: 14px 25px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                position: absolute;
                left: 10px;
                top: 10px;
            }
            .back-button {
            background-color: #f44336;
            color: white;
            padding: 14px 25px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            position: absolute;
            left: 10px;
            top: 10px;
            cursor: pointer;
        }
        #footerFrame {
            width: 100%;
            height: 80px;
            border: none;
                }
        </style>
    </head>
    <body>
        <div style="text-align: center;">
            <h1>Donations</h1>
            <h2>Please enter every information is needed.</h2>
        </div>

        <div class="form-container" style="background-color: antiquewhite;">
           <div class="row">
            <div>
                <img src="istockphoto-1391352876-612x612.jpg">
            </div>
            <div class="column">
                <label for="fname" onsubmit="return validateForm()">Full Name</label></br>
                <input style="width: auto;" type="text" id="fname" name="Full Name"></br>
                <label for="Amount">Amount</label></br>
                <input style="width:auto;" type="text" id="Amount" name="Amount"></br>
                <label for="State">Which state you from:</label></br>
                <select id="State" name="Which state you from:">
                    <option value="Perlis">Perlis</option>
                    <option value="Pulau Pinang">Pulau Pinang</option>
                    <option value="Pahang">Pahang</option>
                    <option value="Perak">Perak</option>
                    <option value="Kedah">Kedah</option>
                    <option value="Kelantan">Kelantan</option>
                    <option value="Negeri Sembilan">Negeri Sembilan</option>
                    <option value="Terengganu">Terengganu</option>
                    <option value="Johor">Johor</option>
                    <option value="Selangor">Selangor</option>
                    <option value="Melaka">Melaka</option>
                    <option value="Sabah">Sabah</option>
                    <option value="Sarawak">Sarawak</option>
                    <option value="Kuala Lumpur">Kuala Lumpur</option>
                </select></br>
                <label for="Bank">Which bank you use:</label></br>
                <select id="Bank" name="Which bank you use:">
                    <option value="MayBank">MayBank</option>
                    <option value="Bank Islam">Bank Islam</option>
                    <option value="Affin Bank Berhad">Affin Bank</option>
                    <option value="CIMB">CIMB</option>
                </select>
                <input type="submit" value="Submit">
                <button class="back-button" onclick="window.close();">Back</button>
            </div>
           </div> 
        </div>
        <iframe src="footer.html" name="footer" id="footerFrame"></iframe>
    </body>
</html>
