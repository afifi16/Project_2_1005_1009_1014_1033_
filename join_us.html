<!DOCTYPE html>
<html>
    <head>
        <script src="join_us.js"></script>
        <style>
            body{
                background-image: url("background3.jpg");
                background-repeat: no-repeat;
                background-size: cover;
            }

            .container{
                background-color: antiquewhite;
                padding: 10px;
                border-radius: 5px;
                width: 80%;
                margin: 20px auto;
            }

            .form-container {
                display: flex;
                flex-direction: column;
                width: 100%;
                margin-bottom: 100px;
            }

            .form-container label {
                font-weight: bold;
                margin-top: 10px;
            }

            .form-container input,
            .form-container select {
                padding: 8px;
                font-size: 14px;
                width: 100%;
                border: 1px solid #ccc;
                border-radius: 5px;
            }

            .form-container input[type="submit"] {
                background-color: #007bff;
                color: white;
                cursor: pointer;
                border: none;
                padding: 10px;
                margin-top: 10px;
            }

            .form-container input[type="submit"]:hover {
                background-color: #0056b3;
            }
            a:link, a:visited {
                background-color: #f44336;
                color: white;
                padding: 14px 25px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                position: absolute;
                left: 10px;
                top: 10px;
            }
            .back-button {
            background-color: #f44336;
            color: white;
            padding: 14px 25px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            position: absolute;
            left: 10px;
            top: 10px;
            cursor: pointer;
        }
        #footerFrame {
            width: 100%;
            height: 80px;
            border: none;
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 1000;
        }

        .row {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
        }

        .column {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            width: 300px;
        }

        @media (max-width: 768px) {
            .row {
                flex-direction: column;
                align-items: center;
            }

            .column {
                width: 100%;
            }
        }
        </style>
    </head>
    <body>
        <div style="text-align: center;">
            <h2>Join Us</h2>
            <h3>Please enter every information is needed.</h3>
        </div>

        <div class="form-container" style="background-color: antiquewhite;">
           <div class="row">
            <div>
                <img src="welcome.jpg" alt="Welcome Image" style="max-width: 100%; border-radius: 10px;">
            </div>
            <div class="column">
                    <label for="fname">Full Name:</label>
                    <input type="text" id="fname" name="Full Name">

                    <label for="Ic">Ic Number:</label>
                    <input type="text" id="Ic" name="Ic Number:">

                    <label for="Contact">Please enter your number:</label>
                    <input type="text" id="Contact" name="Please enter your number:">
                       
                    <input type="submit" value="Submit">
                    <button class="back-button" onclick="window.close();">Back</button>
            </div>
           </div> 
        </div>
        <iframe src="footer.html" name="footer" id="footerFrame"></iframe>
    </body>
</html>
